<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ARZU Reservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --paper:#ecebe7; --card:#f6f5f2; --ink:#17120f; --muted:#6b645d; --line:#cfcbc4; --accent:#7a1016; --ok:#1f6b3a;
  --font-display:"DM Serif Display","Noto Serif KR",Georgia,serif; --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; word-break:keep-all; overflow-wrap:break-word; }
html[lang="en"] body { word-break:normal; }
html[lang="zh"] body, html[lang="ja"] body { word-break:normal; line-break:strict; }
html[lang="zh"] body, html[lang="zh"] button, html[lang="zh"] input, html[lang="zh"] select, html[lang="zh"] textarea { font-family:"Noto Sans SC","Noto Sans KR",system-ui,sans-serif; }
html[lang="ja"] body, html[lang="ja"] button, html[lang="ja"] input, html[lang="ja"] select, html[lang="ja"] textarea { font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif; }
.wrap { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
.top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { font-family:var(--font-display); font-weight:400; font-size:40px; letter-spacing:.1em; line-height:1; margin:0; }
.langs { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.lang-btn { border:1px solid var(--line); background:transparent; color:var(--muted); font:500 12px var(--font-body); padding:5px 9px; border-radius:999px; cursor:pointer; }
.lang-btn[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
h1.title { font-size:22px; margin:22px 0 4px; font-weight:700; }
.lead { margin:0 0 18px; color:var(--muted); font-size:14px; }
.notice { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); padding:10px 12px; font-size:13px; margin:0 0 18px; }
form { display:grid; gap:16px; }
label, .lbl { display:block; font-weight:700; font-size:14px; margin-bottom:6px; }
.opt { font-weight:400; color:var(--muted); font-size:12px; margin-left:4px; }
input[type=text], input[type=date], input[type=number], select, textarea {
  width:100%; font:inherit; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
textarea { min-height:84px; resize:vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.hint { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { position:relative; }
.chip input { position:absolute; opacity:0; inset:0; }
.chip span { display:block; padding:9px 13px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:14px; cursor:pointer; }
.chip input:checked + span { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.chip input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.consent { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; }
.consent input { width:20px; height:20px; margin-top:2px; flex:none; }
.err { color:var(--accent); font-size:13.5px; font-weight:500; min-height:1.2em; }
.submit { font:700 16px var(--font-body); padding:15px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
.submit[disabled] { opacity:.55; cursor:default; }
.hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.done { text-align:center; padding:28px 8px; }
.done .code { font-family:var(--font-display); font-size:44px; letter-spacing:.14em; margin:10px 0; }
.done h2 { font-size:21px; margin:0 0 6px; }
.done p { margin:8px 0; color:var(--muted); }
.done a.btn { display:inline-block; margin-top:14px; padding:12px 20px; border-radius:999px; background:var(--ink); color:var(--paper); text-decoration:none; font-weight:700; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="brand">ARZU</p>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </div>

  <div id="formView">
    <h1 class="title" id="tTitle"></h1>
    <p class="lead" id="tLead"></p>
    <p class="notice" id="tNotice"></p>
    <form id="f" novalidate autocomplete="on">
      <div>
        <label for="name" id="lName"></label>
        <input type="text" id="name" maxlength="60" autocomplete="name">
      </div>
      <div class="row2">
        <div>
          <label for="date" id="lDate"></label>
          <input type="date" id="date">
        </div>
        <div>
          <label for="time" id="lTime"></label>
          <select id="time"></select>
        </div>
      </div>
      <div>
        <label for="party" id="lParty"></label>
        <input type="number" id="party" min="1" max="20" value="2" inputmode="numeric">
        <p class="hint" id="hParty"></p>
      </div>
      <div>
        <span class="lbl" id="lContact"></span>
        <div class="chips" id="ctypes" role="radiogroup" aria-labelledby="lContact"></div>
        <div style="margin-top:10px" id="cvalWrap">
          <input type="text" id="cval" maxlength="80" aria-labelledby="lContact">
        </div>
        <p class="hint" id="hContact"></p>
      </div>
      <div>
        <label for="req" id="lReq"></label>
        <textarea id="req" maxlength="500"></textarea>
      </div>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
      <label class="consent" for="consent">
        <input type="checkbox" id="consent">
        <span id="tConsent"></span>
      </label>
      <p class="err" id="err" role="alert"></p>
      <button type="submit" class="submit" id="go"></button>
    </form>
  </div>

  <div id="doneView" class="done" hidden>
    <h2 id="dTitle"></h2>
    <div class="code" id="dCode"></div>
    <p id="dBody"></p>
    <p id="dDm" hidden></p>
    <a class="btn" id="dBtn" href="https://www.instagram.com/arzu_raon/" target="_blank" rel="noopener" hidden>Instagram @arzu_raon</a>
  </div>
</div>

var lang = "ko", ctype = "phone";
var params = new URLSearchParams(location.search);
var CHANNEL = (params.get("ref") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 20).toUpperCase();

function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

function buildTimes() {
  var sel = $("time"), cur = sel.value, h, m, v, out = [];
  var slots = [];
  for (h = 11; h <= 23; h++) { slots.push(pad(h) + ":00"); slots.push(pad(h) + ":30"); }
  slots.push("00:00", "00:30", "01:00", "01:30", "02:00");
  sel.innerHTML = "";
  var o = document.createElement("option"); o.value = ""; o.textContent = T[lang].timePh; sel.appendChild(o);
  slots.forEach(function (s) { var op = document.createElement("option"); op.value = s; op.textContent = s; sel.appendChild(op); });
  sel.value = cur;
}

function buildTypes() {
  var box = $("ctypes"); box.innerHTML = "";
  ["phone", "instagram", "kakao", "wechat", "line", "none"].forEach(function (k) {
    var l = document.createElement("label"); l.className = "chip";
    var i = document.createElement("input"); i.type = "radio"; i.name = "ctype"; i.value = k; i.checked = (k === ctype);
    i.addEventListener("change", function () { ctype = k; syncContact(); });
    var s = document.createElement("span"); s.textContent = T[lang].types[k];
    l.appendChild(i); l.appendChild(s); box.appendChild(l);
  });
}

function syncContact() {
  var none = ctype === "none";
  $("cvalWrap").hidden = none;
  $("cval").placeholder = none ? "" : (T[lang].ph[ctype] || "");
  $("cval").inputMode = ctype === "phone" ? "tel" : "text";
  $("hContact").textContent = none ? T[lang].noneHint : T[lang].contactHint;
}

function applyLang() {
  var t = T[lang];
  document.documentElement.lang = lang;
  $("tTitle").textContent = t.title; $("tLead").textContent = t.lead; $("tNotice").textContent = t.notice;
  $("lName").textContent = t.name; $("lDate").textContent = t.date; $("lTime").textContent = t.time;
  $("lParty").textContent = t.party; $("hParty").textContent = t.partyHint; $("lContact").textContent = t.contact;
  $("lReq").innerHTML = ""; $("lReq").appendChild(document.createTextNode(t.req));
  var o = document.createElement("span"); o.className = "opt"; o.textContent = t.reqOpt; $("lReq").appendChild(o);
  $("tConsent").textContent = t.consent;
  $("go").textContent = t.go;
  buildTimes(); buildTypes(); syncContact();
  Array.prototype.forEach.call(document.querySelectorAll(".lang-btn"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
}

function setLang(l, remember) {
  lang = l;
  if (remember) { try { localStorage.setItem("arzu_lang", l); } catch (e) {} }
  applyLang();
  if (!$("doneView").hidden) fillDone();
}

var lastCode = "", lastNone = false;
function fillDone() {
  var t = T[lang];
  $("dTitle").textContent = t.done; $("dCode").textContent = lastCode;
  $("dBody").textContent = lastNone ? t.doneNone : t.doneBody;
  $("dBtn").textContent = t.ig; $("dBtn").hidden = !lastNone;
  $("dDm").hidden = true;
}

function rpc(fn, args) {
  return fetch(SB + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  }).then(function (r) {
    return r.text().then(function (txt) {
      var j = null; try { j = JSON.parse(txt); } catch (e) { j = txt; }
      if (!r.ok) { var m = (j && j.message) || String(txt); var er = new Error(m); throw er; }
      return j;
    });
  });
}

$("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var t = T[lang], e = t.e, err = $("err"); err.textContent = "";
  var name = $("name").value.trim(), date = $("date").value, time = $("time").value;
  var party = parseInt($("party").value, 10), cval = $("cval").value.trim();
  if (!name) { err.textContent = e.name; $("name").focus(); return; }
  if (!date) { err.textContent = e.date; $("date").focus(); return; }
  if (date < today()) { err.textContent = e.past; $("date").focus(); return; }
  var dp = date.split("-"); if (new Date(+dp[0], +dp[1] - 1, +dp[2]).getDay() === 1) { err.textContent = e.mon; $("date").focus(); return; }
  if (!time) { err.textContent = e.time; $("time").focus(); return; }
  if (!(party >= 1 && party <= 20)) { err.textContent = e.party; $("party").focus(); return; }
  if (ctype !== "none" && cval.length < 2) { err.textContent = e.contact; $("cval").focus(); return; }
  if (!$("consent").checked) { err.textContent = e.consent; $("consent").focus(); return; }
  if ($("website").value) { lastCode = "------"; lastNone = false; showDone(); return; }
  var btn = $("go"); btn.disabled = true; btn.textContent = t.going;
  rpc("submit_reservation", {
    p_name: name, p_contact_type: ctype, p_contact: ctype === "none" ? null : cval, p_party: party,
    p_date: date, p_time: time, p_channel: CHANNEL || null, p_lang: lang, p_request: $("req").value.trim() || null, p_consent: true
  }).then(function (code) {
    lastCode = String(code); lastNone = (ctype === "none"); showDone();
  }).catch(function (x) {
    btn.disabled = false; btn.textContent = t.go;
    err.textContent = /too_many/.test(x.message) ? e.many : e.fail;
  });
});

function showDone() {
  $("formView").hidden = true; $("doneView").hidden = false; fillDone(); window.scrollTo(0, 0);
}

(function init() {
  var langsEl = $("langs");
  LANGS.forEach(function (l) {
    var b = document.createElement("button"); b.type = "button"; b.className = "lang-btn"; b.setAttribute("data-lang", l[0]); b.textContent = l[1];
