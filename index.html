<style>
/* Layout idea: a paper menu on a phone. Sticky tab strip, one panel at a time, name left and price right on every row. */
:root {
  --paper: #ecebe7;
  --card: #f6f5f2;
  --ink: #17120f;
  --muted: #6b645d;
  --line: #cfcbc4;
  --accent: #7a1016;

  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
header { padding: 28px 16px 16px; max-width: 640px; margin: 0 auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .12em; line-height: 1; margin: 0; }
.sub { margin: 8px 0 0; font-size: 12px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
.ask { margin: 14px 0 0; font-size: 14px; font-weight: 500; color: var(--accent); }
.tabs-wrap { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; max-width: 640px; margin: 0 auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
  font: 500 14px var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }
.sec { margin-top: 28px; }
.sec h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.sec .note { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.list { margin: 10px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
.item { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item .l { min-width: 0; }
.tag { display: block; font-size: 10.5px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.ko { font-weight: 700; font-size: 15.5px; }
.en { display: block; font-size: 12.5px; color: var(--muted); }
.desc { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.price { flex: none; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dmq { flex: none; align-self: center; font-size: 12px; font-weight: 500; color: var(--accent); white-space: nowrap; }
.price small { display: inline-block; font-weight: 500; font-size: 11px; color: var(--muted); margin-right: 4px; }
.price .row { display: block; }
.price s { font-weight: 400; color: var(--muted); margin-right: 6px; }
.grid { margin: 10px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; border-top: 1px solid var(--ink); }
.grid li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.flat { display: inline-block; margin-top: 8px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.hh { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 14px 14px 4px; margin-top: 24px; }
.hh h2 { color: var(--accent); }
.hh .list { border-top-color: var(--line); }
.hh .item:last-child { border-bottom: 0; }
footer { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; font-size: 12px; color: var(--muted); }
footer p { margin: 0 0 8px; }
footer .dm { color: var(--ink); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .tab { transition: background .15s, color .15s; } }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.langs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.lang-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 12px var(--font-body); padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.lang-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lang-btn:focus-visible, .gate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cur { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.gate { position: fixed; inset: 0; z-index: 50; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
.gate[hidden] { display: none; }
.gate-in { width: 100%; max-width: 420px; }
.gate-brand { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: .14em; margin: 0 0 18px; }
.gate-in h2 { font-size: 20px; margin: 0; font-weight: 700; }
.gate-sub { margin: 8px 0 22px; font-size: 12.5px; line-height: 1.6; color: #b9b2aa; }
.gate-list { display: grid; gap: 10px; }
.gate-btn { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 1px solid #5a514a; background: transparent; color: var(--paper); padding: 16px 18px; border-radius: 10px; cursor: pointer; font-family: var(--font-body); }
.gate-btn:hover { border-color: var(--paper); }
.gate-name { font-size: 20px; font-weight: 700; }
.gate-sub-l { font-size: 12.5px; color: #b9b2aa; }
html[lang="zh"] body, html[lang="zh"] button { font-family: "Noto Sans SC", "Noto Sans KR", system-ui, sans-serif; }
html[lang="ja"] body, html[lang="ja"] button { font-family: "Noto Sans JP", "Noto Sans KR", system-ui, sans-serif; }

var LATIN = /^[\u0000-ɏ -⁯×+&\s]+$/;
var lang = "ko";
var curTab = "food";

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function won(n) { return Number(n).toLocaleString("ko-KR"); }

function bottles(e) {
  var n = parseInt(e, 10);
  if (lang === "zh") return n + "瓶";
  if (lang === "ja") return n + "本";
  return n + (n === 1 ? " bottle" : " bottles");
}

function view(it) {
  var isBottle = /^\d+ BOTTLES$/.test(it.e || "");
  if (lang === "ko") return { name: it.n, sub: it.e || "", desc: it.d || "" };
  var r = TR[it.k || it.n];
  var t = r ? r[LI[lang]] : null;
  var name = (t && t[0]) || (isBottle ? it.n : it.e) || it.n;
  var sub = "";
  if (isBottle) sub = bottles(it.e);
  else if (lang !== "en" && t && t[0] && it.e && it.e !== name && !LATIN.test(name)) sub = it.e;
  return { name: name, sub: sub, desc: (t && t[1]) || "" };
}

function itemHtml(it, ask, priced) {
  var v = view(it);
  var h = '<li class="item"><div class="l">';
  if (it.c) h += '<span class="tag">' + esc(lang === "ko" ? it.c : (COUNTRY[it.c] ? COUNTRY[it.c][LI[lang] === undefined ? 0 : LI[lang]] : it.c)) + '</span>';
  h += '<span class="ko">' + esc(v.name) + '</span>';
  if (v.sub) h += '<span class="en">' + esc(v.sub) + '</span>';
  if (v.desc) h += '<span class="desc">' + esc(v.desc) + '</span>';
  h += '</div>';
  if (priced && it.p != null) h += '<div class="price">' + won(it.p) + '</div>';
  else if (ask) h += '<div class="dmq">' + esc(UI[lang].dm) + '</div>';
  return h + '</li>';
}

function noteText(n) {
  if (lang === "ko" || !NOTE[n]) return lang === "ko" ? n : "";
  return NOTE[n][LI[lang]];
}

function secHtml(s, ask, priced) {
  var h = '<section class="sec ' + (s.cls || "") + '"><h2>' + esc(s.t) + '</h2>';
  var note = s.note ? noteText(s.note) : "";
  if (note) h += '<p class="note">' + esc(note) + '</p>';
  var items = s.grid ? s.grid.map(function (g) { return { n: g[0], e: g[1], p: s.flat }; }) : s.items;
  h += '<ul class="list">' + items.map(function (it) { return itemHtml(it, ask, priced); }).join("") + '</ul>';
  return h + '</section>';
}

var ASK_TABS = ["cocktail", "champagne", "wine", "spirits", "set"]; /* 술 탭: 각 줄 옆에 DM 문의 표시 */
var PRICE_TABS = ["food", "drinks", "cocktail"]; /* 가격을 보여주는 탭 */

function render() {
  var u = UI[lang];
  document.documentElement.lang = lang;
  var tabsEl = document.getElementById("tabs");
  var panelsEl = document.getElementById("panels");
  tabsEl.innerHTML = "";
  panelsEl.innerHTML = "";
  DATA.forEach(function (d) {
    var b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.id = "tab-" + d.id;
    b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel-" + d.id);
    b.textContent = u.tabs[d.id];
    b.addEventListener("click", function () { show(d.id, true); });
    tabsEl.appendChild(b);
    var p = document.createElement("div");
    p.id = "panel-" + d.id; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "tab-" + d.id);
    p.innerHTML = d.secs.map(function (s) { return secHtml(s, ASK_TABS.indexOf(d.id) >= 0, PRICE_TABS.indexOf(d.id) >= 0); }).join("");
    panelsEl.appendChild(p);
  });
  document.getElementById("ask").textContent = u.ask;
  document.getElementById("cur").textContent = u.cur;
  document.getElementById("foot").innerHTML =
    '<p class="dm">' + esc(u.foot) + '</p><p>' + esc(u.prepay) + '</p><p>' + esc(u.origin) + '</p>';
  Array.prototype.forEach.call(document.querySelectorAll(".lang-btn"), function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
  });
  show(curTab, false);
}

function show(id, push) {
  if (!DATA.some(function (d) { return d.id === id; })) id = DATA[0].id;
  curTab = id;
  DATA.forEach(function (d) {
    var on = d.id === id;
    document.getElementById("panel-" + d.id).hidden = !on;
    var t = document.getElementById("tab-" + d.id);
    t.setAttribute("aria-selected", on ? "true" : "false");
    if (on && push) { try { t.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} }
  });
  if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; } window.scrollTo(0, 0); }
}

function setLang(id, remember) {
  lang = id;
  if (remember) { try { localStorage.setItem("arzu_lang", id); } catch (e) {} }
  document.getElementById("gate").hidden = true;
  render();
}

function buildLangButtons() {
  var gl = document.getElementById("gatelist");
  var sw = document.getElementById("langs");
  LANGS.forEach(function (l) {
    var g = document.createElement("button");
    g.type = "button"; g.className = "gate-btn";
    g.innerHTML = '<span class="gate-name">' + esc(l.name) + '</span><span class="gate-sub-l">' + esc(l.sub) + '</span>';
    g.addEventListener("click", function () { setLang(l.id, true); });
    gl.appendChild(g);
    var s = document.createElement("button");
    s.type = "button"; s.className = "lang-btn"; s.setAttribute("data-lang", l.id);
    s.textContent = l.name;
    s.addEventListener("click", function () { setLang(l.id, true); });
    sw.appendChild(s);
  });
}

buildLangButtons();
window.addEventListener("hashchange", function () { show(location.hash.slice(1), false); });
curTab = location.hash.slice(1) || "food";
var saved = null;
try { saved = localStorage.getItem("arzu_lang"); } catch (e) {}
if (saved && UI[saved]) { lang = saved; render(); }
else {
  render();
  document.getElementById("gate").hidden = false;
  var first = document.querySelector(".gate-btn");
  if (first) first.focus();
}
